<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cicada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>

<body>

<section>
    <div class="ccd-timeline">
        <div class="container page--width">
            <h1 class="page--head text-center">Order Status</h1>
       
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 ">
                    <div class="ccd-orderpg">
                        <h2>Order ID #181717</h2>
                        <p>Placed on Jan 24, 2025</p>
                    </div>
                    <div class="row flex-md-row flex-column justify-content-between align-items-center hh-grayBox text-center">
                        <div class="order-tracking completed">
                            <span class="is-complete"></span>
                            <p>Ordered<br><span>Mon, June 25</span></p>
                        </div>
                        <div class="order-tracking">
                            <span class="is-complete"></span>
                            <p>Shipped<br><span>Tue, June 25</span></p>
                        </div>
                        <div class="order-tracking">
                            <span class="is-complete"></span>
                            <p>En Route<br><span>Tue, June 26</span></p>
                        </div>
                        <div class="order-tracking">
                            <span class="is-complete"></span>
                            <p>Delivered<br><span>Fri, June 28</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    .ccd-timeline{
        .ccd-orderpg{
        margin-bottom: 30px;
        h2{
            font-size: 1.5rem;
        }
        p{
            color: #b2b2b2;
        }
    }
    .hh-grayBox {
        background-color: #181717;
        padding: 35px;
        margin: 20px 0;
        border-radius: 10px;
    }
    .order-tracking {
        text-align: center;
        flex: 1;
        min-width: 100px;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .order-tracking .is-complete {
        display: block;
        position: relative;
        border-radius: 50%;
        height: 30px;
        width: 30px;
        background-color: #f7be16;
        margin-bottom: 10px;
        z-index: 2;
    }
    .order-tracking .is-complete:after {
        content: "";
        position: absolute;
        height: 14px;
        width: 7px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(45deg);
        border: 2px solid transparent;
        opacity: 0;
    }
    .order-tracking.completed .is-complete {
        background-color: #27aa80;
    }
    .order-tracking.completed .is-complete:after {
        border-color: #fff;
        border-width: 0px 3px 3px 0;
        opacity: 1;
    }
    .order-tracking p {
        color: #5a5858;
        font-size: 16px;
        margin-top: 5px;
        line-height: 20px;
    }
    .order-tracking p span {
        font-size: 14px;
    }
    .order-tracking.completed p {
        color: #ffffff;
    }
    .order-tracking::before {
        content: "";
        display: block;
        height: 3px;
        width: 100%;
        background-color: #f7be16;
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 0;
    }
    .order-tracking.completed:before {
        background-color: #27aa80;
    }
    @media (max-width: 768px) {
        .order-tracking {
            width: 100%;
        }
        .order-tracking::before {
            width: 3px;
            height: 100%;
            top: 0;
            left: 15px;
            transform: translateX(0);
        }
        .order-tracking:first-child::before {
            display: block;
            height: 100%;
        }
        .order-tracking .is-complete {
            margin-left: 15px;
        }
    }
    }
   
</style>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>
</body>

</html>
